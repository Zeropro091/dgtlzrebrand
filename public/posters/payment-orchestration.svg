<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" font-family="'JetBrains Mono', monospace">
  <!-- DGTLZ FINTECH POSTER: NON-CUSTODIAL ORCHESTRATION — V.05 spec -->

  <!-- ============ SUBSTRATE ============ -->
  <rect width="1024" height="1024" fill="#F4F4F2"/>

  <!-- ============ CONSTRUCTION GRID (1px Klein Blue, 12 columns) ============ -->
  <g stroke="#0B17EF" stroke-width="1" opacity="0.35">
    <!-- vertical lanes: 12 columns -->
    <line x1="85" y1="90" x2="85" y2="934"/>
    <line x1="160" y1="90" x2="160" y2="934"/>
    <line x1="235" y1="90" x2="235" y2="934"/>
    <line x1="310" y1="90" x2="310" y2="934"/>
    <line x1="385" y1="90" x2="385" y2="934"/>
    <line x1="460" y1="90" x2="460" y2="934"/>
    <line x1="535" y1="90" x2="535" y2="934"/>
    <line x1="610" y1="90" x2="610" y2="934"/>
    <line x1="685" y1="90" x2="685" y2="934"/>
    <line x1="760" y1="90" x2="760" y2="934"/>
    <line x1="835" y1="90" x2="835" y2="934"/>
    <line x1="910" y1="90" x2="910" y2="934"/>
    <!-- horizontal registration rows -->
    <line x1="60" y1="230" x2="964" y2="230"/>
    <line x1="60" y1="560" x2="964" y2="560"/>
    <line x1="60" y1="830" x2="964" y2="830"/>
  </g>

  <!-- registration cross marks (4 corners) -->
  <g stroke="#0B17EF" stroke-width="2">
    <path d="M 40 30 h 20 M 50 20 v 20"/>
    <path d="M 964 30 h 20 M 974 20 v 20"/>
    <path d="M 40 994 h 20 M 50 984 v 20"/>
    <path d="M 964 994 h 20 M 974 984 v 20"/>
  </g>

  <!-- ============ TOP HEADER BAR ============ -->
  <rect x="0" y="0" width="1024" height="56" fill="#0B17EF"/>
  <text x="40" y="36" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="2">DGTLZ.AGENCY</text>
  <text x="984" y="36" fill="#ffffff" font-size="16" text-anchor="end" letter-spacing="2">FINT/LAB</text>

  <!-- ============ DISPLAY TYPE (Didone) ============ -->
  <g font-family="'Playfair Display', serif" font-weight="900" fill="#111111">
    <text x="60" y="200" font-size="110" letter-spacing="-3">NON-</text>
    <text x="60" y="300" font-size="110" letter-spacing="-3">CUSTODIAL<tspan fill="#0B17EF">.</tspan></text>
  </g>
  <!-- mono annotation under display type -->
  <text x="62" y="336" fill="#0B17EF" font-size="13" letter-spacing="2">FUNDS SETTLE ON PSP INFRASTRUCTURE ONLY — THE AGENCY NEVER TOUCHES CLIENT MONEY</text>

  <!-- ============ BLUEPRINT DIAGRAM ============ -->
  <!-- central ORCHESTRATOR node -->
  <rect x="412" y="560" width="200" height="120" fill="#0B17EF"/>
  <text x="512" y="612" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="1.5">ORCHESTRATOR</text>
  <text x="512" y="640" fill="#ffffff" font-size="12" text-anchor="middle" letter-spacing="1" opacity="0.85">ROUTING // NON-CUSTODIAL</text>

  <!-- PSP nodes at 4 corners of diagram field -->
  <g>
    <!-- top-left PSP -->
    <rect x="120" y="420" width="130" height="70" fill="none" stroke="#0B17EF" stroke-width="3"/>
    <text x="185" y="450" fill="#0B17EF" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2">PSP</text>
    <text x="185" y="472" fill="#0B17EF" font-size="10" text-anchor="middle">SUB-MERCHANT 01</text>

    <!-- top-right PSP -->
    <rect x="774" y="420" width="130" height="70" fill="none" stroke="#0B17EF" stroke-width="3"/>
    <text x="839" y="450" fill="#0B17EF" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2">PSP</text>
    <text x="839" y="472" fill="#0B17EF" font-size="10" text-anchor="middle">SUB-MERCHANT 02</text>

    <!-- bottom-left PSP -->
    <rect x="120" y="750" width="130" height="70" fill="none" stroke="#0B17EF" stroke-width="3"/>
    <text x="185" y="780" fill="#0B17EF" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2">PSP</text>
    <text x="185" y="802" fill="#0B17EF" font-size="10" text-anchor="middle">SUB-MERCHANT 03</text>

    <!-- bottom-right PSP -->
    <rect x="774" y="750" width="130" height="70" fill="none" stroke="#0B17EF" stroke-width="3"/>
    <text x="839" y="780" fill="#0B17EF" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2">PSP</text>
    <text x="839" y="802" fill="#0B17EF" font-size="10" text-anchor="middle">SUB-MERCHANT 04</text>
  </g>

  <!-- orthogonal routing lines (2px, no diagonals) -->
  <g stroke="#0B17EF" stroke-width="2" fill="none">
    <!-- top-left PSP -> orchestrator: right, down -->
    <path d="M 250 455 H 512 V 560"/>
    <!-- top-right PSP -> orchestrator: left, down -->
    <path d="M 774 455 H 512 V 560"/>
    <!-- bottom-left PSP -> orchestrator: right, up -->
    <path d="M 250 785 H 512 V 680"/>
    <!-- bottom-right PSP -> orchestrator: left, up -->
    <path d="M 774 785 H 512 V 680"/>
  </g>

  <!-- direction arrows on routing lines -->
  <g fill="#0B17EF">
    <path d="M 512 555 l -6 10 h 12 z"/>
    <path d="M 512 555 l -6 10 h 12 z" transform="translate(-260,0)"/>
    <path d="M 512 685 l -6 -10 h 12 z" transform="translate(-260,0)"/>
    <path d="M 512 685 l -6 -10 h 12 z"/>
  </g>

  <!-- ledger annotations beside lines -->
  <g fill="#0B17EF" font-size="11" letter-spacing="1">
    <text x="300" y="447">LEDGER // APPEND-ONLY →</text>
    <text x="620" y="447">← RECON // DAILY</text>
    <text x="300" y="777">← WEBHOOK // IDEMPOTENT</text>
    <text x="620" y="777">SETTLEMENT // T+1 →</text>
  </g>

  <!-- ============ GLITCH STRIPS (3 horizontal displacement slices) ============ -->
  <g>
    <rect x="0" y="505" width="1024" height="10" fill="#0B17EF" opacity="0.92"/>
    <rect x="0" y="700" width="1024" height="6" fill="#0B17EF" opacity="0.92"/>
    <rect x="0" y="872" width="1024" height="8" fill="#0B17EF" opacity="0.92"/>
  </g>
  <!-- duplicated displaced type fragment (the glitch moment) -->
  <text x="62" y="880" fill="#0B17EF" font-size="16" letter-spacing="2" opacity="0.9" transform="translate(8,0)">NON-CUSTODIAL. NON-CUSTODIAL.</text>

  <!-- archive metadata labels -->
  <g fill="#0B17EF" font-size="10" letter-spacing="1.5">
    <text x="62" y="415">ARCHIVE 017 // FINTECH-INFRA</text>
    <text x="962" y="415" text-anchor="end">GRID 04 / T_07</text>
    <text x="62" y="856">DOUBLE-ENTRY // AUDIT-READY</text>
    <text x="962" y="856" text-anchor="end">FIG. 01 — REFERENCE ARCHITECTURE</text>
  </g>

  <!-- ============ DIAGONAL BAR (lower-right, 45°) ============ -->
  <g transform="rotate(45 890 900)">
    <rect x="790" y="892" width="220" height="14" fill="#0B17EF"/>
  </g>

  <!-- ============ BOTTOM BAR ============ -->
  <rect x="0" y="968" width="1024" height="56" fill="#0B17EF"/>
  <text x="40" y="1004" fill="#ffffff" font-size="16" letter-spacing="1.5">DGT — PAYMENT ORCHESTRATION</text>
  <text x="900" y="1004" fill="#ffffff" font-size="12" text-anchor="end" letter-spacing="1">PBI 23/6/PBI/2021 // COMPLIANT</text>
  <!-- four-point star -->
  <path fill="#ffffff" d="M 950 990 Q 950 1000 960 1000 Q 950 1000 950 1010 Q 950 1000 940 1000 Q 950 1000 950 990 Z"/>

  <!-- ============ INK GRAIN (subtle) ============ -->
  <g opacity="0.03" fill="#111111">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#grain)"/>
  </g>
  <defs>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#111111"/>
      <rect x="2" y="2" width="2" height="2" fill="#ffffff"/>
    </pattern>
  </defs>
</svg>
